<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Teste GladePay Direto</title>
  <style>
    body { font-family: Arial; max-width: 800px; margin: 50px auto; padding: 20px; }
    button { background: #0070f3; color: white; border: none; padding: 15px 30px; 
             border-radius: 6px; cursor: pointer; font-size: 16px; margin: 10px 0; }
    button:hover { background: #0051cc; }
    pre { background: #f5f5f5; padding: 15px; border-radius: 6px; overflow-x: auto; }
    .error { color: #dc2626; }
    .success { color: #059669; }
  </style>
</head>
<body>
  <h1>🧪 Teste GladePay - Diagnóstico Completo</h1>
  
  <button onclick="testAPI()">1. Testar API Backend (/api/gladepay-deposito)</button>
  <button onclick="testDirectGladePay()">2. Testar GladePay Direto (do navegador)</button>
  <button onclick="testBalance()">3. Testar Saldo GladePay</button>
  
  <div id="result"></div>

  <script>
    const resultDiv = document.getElementById('result');

    function log(msg, isError = false) {
      const p = document.createElement('pre');
      p.className = isError ? 'error' : 'success';
      p.textContent = msg;
      resultDiv.appendChild(p);
    }

    async function testAPI() {
      resultDiv.innerHTML = '<h2>Testando via backend...</h2>';
      try {
        log('Chamando /api/gladepay-deposito...');
        
        const res = await fetch('/api/gladepay-deposito', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            amountCents: 2990,
            reference: 'teste-' + Date.now(),
            payerName: 'Teste',
            description: 'Teste diagnóstico'
          })
        });

        log(`Status: ${res.status} ${res.statusText}`);
        
        const data = await res.json();
        log('Resposta:\n' + JSON.stringify(data, null, 2), !res.ok);

        if (res.ok && data.qrCodeText) {
          log('✅ FUNCIONOU! QR Code gerado com sucesso!', false);
        }
      } catch (err) {
        log('Erro de rede:\n' + err.message, true);
      }
    }

    async function testDirectGladePay() {
      resultDiv.innerHTML = '<h2>Testando GladePay direto (sem backend)...</h2>';
      
      const key = 'gp_live_1FvWAr7Hz8kvIFePYG5d0zJcFauRanKp';
      
      try {
        log('Chamando https://app.gladepay.com.br/v1/deposito...');
        
        const res = await fetch('https://app.gladepay.com.br/v1/deposito', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + key
          },
          body: JSON.stringify({
            amountCents: 1000,
            description: 'Teste direto'
          })
        });

        log(`Status: ${res.status} ${res.statusText}`);
        
        const data = await res.json().catch(() => ({}));
        log('Resposta:\n' + JSON.stringify(data, null, 2), !res.ok);

        if (res.ok) {
          log('✅ Chave funciona! GladePay respondeu OK', false);
        } else if (res.status === 403) {
          log('❌ 403 Forbidden - possíveis causas:\n' +
              '1. Chave inválida/revogada\n' +
              '2. Conta bloqueada\n' +
              '3. API key sem permissão de criar depósito', true);
        }
      } catch (err) {
        log('Erro CORS ou rede:\n' + err.message + 
            '\n(CORS é normal - significa que o backend precisa fazer a chamada)', true);
      }
    }

    async function testBalance() {
      resultDiv.innerHTML = '<h2>Testando saldo (GET /saldo)...</h2>';
      
      try {
        log('Chamando backend para checar saldo...');
        
        // Vamos criar um endpoint temporário ou chamar direto
        const key = 'gp_live_1FvWAr7Hz8kvIFePYG5d0zJcFauRanKp';
        
        const res = await fetch('https://app.gladepay.com.br/v1/saldo', {
          headers: { 'Authorization': 'Bearer ' + key }
        });

        log(`Status: ${res.status} ${res.statusText}`);
        
        const data = await res.json().catch(() => ({}));
        log('Saldo:\n' + JSON.stringify(data, null, 2), !res.ok);

        if (res.ok) {
          log('✅ Chave válida! Saldo: R$ ' + (data.availableCents / 100).toFixed(2), false);
        }
      } catch (err) {
        log('Erro CORS (esperado do navegador):\n' + err.message, false);
      }
    }
  </script>
</body>
</html>
